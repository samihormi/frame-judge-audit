[project]
name = "frame-judge-audit"
version = "0.1.0"
description = "Auditing an LLM judge and a public blackmail classifier on Inspect agentic_misalignment transcripts"
requires-python = ">=3.10"
dependencies = ["matplotlib", "beautifulsoup4", "httpx"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Scripts, not an installable package: install only the dependencies.
[tool.setuptools]
py-modules = []
packages = []
